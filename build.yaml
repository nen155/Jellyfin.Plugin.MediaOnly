overview: "Ignora archivos que no sean vídeo o imagen al escanear bibliotecas."
description: >
  Aplica una regla de resolución (IResolverIgnoreRule) que descarta durante el
  escaneo de bibliotecas cualquier archivo cuya extensión no figure en la lista
  configurable de extensiones permitidas (vídeo e imagen por defecto).
